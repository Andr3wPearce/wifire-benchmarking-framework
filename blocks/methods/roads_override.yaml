name: roads_override
kind: method
description: >
  Roads, urban and other non-burnable codes that are not water or snow
  (FBFM40 91, 93, 99) set to a burnable fuel model, so every model treats them
  the same way instead of each model's own non-burnable handling.
consumes:
- fuel_model_fbfm40
produces:
- fuel_model_fbfm40
params:
  replacement_fuel:
    type: str
    default: GR2                  # Scott & Burgan name; the block maps it to the FBFM40 code (102)
execution:
  image: core
