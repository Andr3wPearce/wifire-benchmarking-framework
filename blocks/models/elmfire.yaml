name: elmfire
kind: model
version: pyretechnics-2026.10.20
description: >
  ELMFIRE-style level-set spread model, via SIG's pyretechnics. The adapter
  (blocks/models/elmfire.py) converts canonical inputs into
  pyretechnics' space-time cubes and its outputs back into a canonical
  Prediction.
requires:
- fuel_model_fbfm40
- canopy_cover
- canopy_height
- canopy_base_height
- canopy_bulk_density
- elevation
- surface_wind
- fuel_moisture
- ignition
uses_if_present:
- gridded_wind
produces:
- perimeter
- arrival_time
- fireline_intensity
- spread_rate
- flame_length
params:
  spread_adjustment:
    type: float
    default: 1.5
    range: [0.5, 3.0]
    rationale: pyretechnics fuel_spread_adjustment; matched to FARSITE so both models spread alike
  duration_min:
    type: float
    default: 240
    range: [10, 4320]
    rationale: simulated minutes after ignition
  band_duration_min:
    type: float
    default: 60
    range: [10, 180]
    rationale: time step of the weather cubes; hourly matches station weather
native:
  crs: EPSG:5070                  # runs on the case grid at the case resolution (no regrid)
resources:
  cpu: 2
  memory_gb: 6
execution:
  image: elmfire
