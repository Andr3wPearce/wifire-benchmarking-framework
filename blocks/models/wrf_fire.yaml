name: wrf_fire
kind: model
version: '4.6'
description: >
  WRF-Fire, coupled atmosphere-fire. Not implemented yet, and it needs inputs
  no current source provides (3D atmospheric forcing, FBFM13 fuels), so the
  resolver skips it for that reason first.
requires:
- fuel_model_fbfm13
- elevation
- atmos_forcing_3d
- fuel_moisture
- ignition
produces:
- perimeter
- wrf.ground_heat_flux
