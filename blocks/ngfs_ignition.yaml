name: ngfs_ignition
kind: source
slot: ignition
description: Ignition point first NOAA Next Generation Fire System (GOES) detection, as a lat/lon and a UTC time.
produces:
- ignition
params:
  lat: {type: float, default: null, rationale: WGS84 degrees}
  lon: {type: float, default: null, rationale: WGS84 degrees}
  time_utc: {type: str, default: null, rationale: ISO 8601 UTC; becomes minutes since the case t0}
  source: {type: str, default: "", rationale: where the point comes from (shown in provenance)}
native:
  crs: EPSG:4326          # the framework inserts a reproject step to the case CRS
execution:
  python: images/core/core_blocks.py
  wstc_image: core                 # images/wstc/core (TEMP(wstc-minimal) naming)
image: registry.example/blocks/ngfs:0.2
