name: elmfire
kind: model
version: pyretechnics-2026.1
requires:
- fuel_model_fbfm40
- canopy_cover
- canopy_height
- canopy_base_height
- canopy_bulk_density
- elevation
- surface_wind
- fuel_moisture
- ignition
uses_if_present:
- gridded_wind
produces:
- perimeter
- arrival_time
- fireline_intensity
params:
  spread_adjustment:
    type: float
    default: 1.5
    range:
    - 0.5
    - 3.0
native:
  crs: EPSG:5070
  resolution_m: 90
resources:
  cpu: 2
  memory_gb: 8
  timeout_min: 10
image: registry.example/blocks/elmfire:2026.1
