name: triangulated_ignition
kind: source
slot: ignition
description: Ignition point triangulated from reports (lookout, 911, cameras), as a lat/lon and a UTC time.
produces:
- ignition
params:
  lat: {type: float, default: null, rationale: WGS84 degrees}
  lon: {type: float, default: null, rationale: WGS84 degrees}
  time_utc: {type: str, default: null, rationale: ISO 8601 UTC; becomes minutes since the case t0}
  source: {type: str, default: "", rationale: where the point comes from (kept in provenance)}
native:
  crs: EPSG:4326                  # lat/lon in, so the resolver inserts a reproject step to the case CRS
execution:
  code: images/core/core_blocks.py
  image: core
