name: station_wind
kind: source
slot: weather
description: >
  Hourly 10 m wind from the nearest ASOS station that has data for the case
  window (Iowa Environmental Mesonet), uniform over the domain. The block
  rotates directions from true north to grid north itself, so it hands over
  canonical data directly (no reproject step).
produces:
- surface_wind
params:
  station: {type: str, default: "", rationale: "IEM station id (e.g. SDB); empty = nearest with data"}
  network: {type: str, default: CA_ASOS, rationale: IEM network to search}
  max_km: {type: float, default: 80, rationale: farthest station considered}
execution:
  image: core
