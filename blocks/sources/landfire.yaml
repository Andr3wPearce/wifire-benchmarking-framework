name: landfire
kind: source
slot: landscape
version: '2024'                   # LANDFIRE release; elevation always comes from LF 2020 (topography)
description: >
  LANDFIRE fuels, canopy and elevation for the case domain, from the LANDFIRE
  Product Service (LFPS). LFPS clips and projects on its side; the block puts
  every layer on the case grid and converts LANDFIRE's scaled integers to SI.
produces:
- fuel_model_fbfm40
- canopy_cover
- canopy_height
- canopy_base_height
- canopy_bulk_density
- elevation
native:
  crs: EPSG:5070                  # requested from LFPS in the case CRS, so no reproject step
  resolution_m: 30
execution:
  image: core
