[project]
name = "bench"
version = "0.2.0"
description = "Composable wildfire spread-model benchmarking framework (SCIL, AI Collaborative for Wildfire WS2)"
requires-python = ">=3.10"
# what the notebook needs to plan, compile and push a workflow; the blocks' own
# packages live in their images (images/wstc/*/requirements.txt)
dependencies = ["pyyaml", "requests", "ipython"]

[project.optional-dependencies]
# to run tests/test_blocks.py locally (the ELMFIRE image's packages)
blocks = ["numpy~=1.26.2", "rasterio~=1.4.3", "matplotlib<3.10", "pyretechnics==2026.10.20"]
test = ["pytest", "dagster==1.13.26"]
notebook = ["jupyterlab"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = ["ignore::PendingDeprecationWarning"]
