[project]
name = "bench"
version = "0.1.0"
description = "Composable wildfire spread-model benchmarking framework (SCIL), Dagster prototype"
requires-python = ">=3.10,<3.14"
dependencies = ["dagster>=1.10", "dagster-webserver>=1.10", "pyyaml", "rasterio>=1.4", "numpy"]

[project.optional-dependencies]
k8s = ["dagster-k8s"]      # run real blocks as Kubernetes pods (minikube locally, NRP later)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.dagster]
module_name = "bench.definitions"
code_location_name = "benchmarking"
